# Server only, for both environments. The proxy in infra/edge/ reaches the web
# server over the network `edge`, so this stack publishes no ports.
services:
  web:
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
    networks:
      default:
      edge:
        aliases:
          # `icde-web` for production, `icde-dev-web` for development.
          - ${COMPOSE_PROJECT_NAME}-web

networks:
  edge:
    external: true
