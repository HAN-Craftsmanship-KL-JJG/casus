# Server only. Caddy takes ports 80 and 443 and gets the certificates.
services:
  web:
    container_name: icde-web
    environment:
      SITE_ADDRESS: icde.nl
    cap_add:
      # Needed to listen on ports below 1024.
      - NET_BIND_SERVICE
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infra/caddy/deploy.caddy:/etc/caddy/conf.d/deploy.caddy:ro
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
    networks:
      - default
      # Shared with doco-cd, so Caddy can pass the webhook on to it.
      - edge

networks:
  edge:
    external: true
