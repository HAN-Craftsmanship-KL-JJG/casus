# Server only: lets the proxy in infra/edge/ reach the web server.
services:
  web:
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
    networks:
      default:
      edge:
        aliases:
          # icde-web or icde-dev-web.
          - ${COMPOSE_PROJECT_NAME}-web

  api:
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m

networks:
  edge:
    external: true
