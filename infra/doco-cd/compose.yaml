# doco-cd, the program that deploys the ICDE stack on the server.
# This is its own Compose project. Start it once by hand on the server:
# `docker compose up -d`. doco-cd does not deploy or update itself.
# It deploys only the project that .doco-cd.yml in the repository root names, and leaves
# all other containers on the server alone.
name: doco-cd

services:
  app:
    container_name: doco-cd
    image: ghcr.io/kimdre/doco-cd:0.134.0
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
    environment:
      TZ: Europe/Amsterdam
      # The workflow .github/workflows/deploy.yml calls the webhook after a
      # push, so a change deploys within seconds. The value comes from the
      # file `.env` next to this file on the server.
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?Set WEBHOOK_SECRET in .env}
      # Safety net for a lost webhook call: ask GitHub once per hour.
      # The repository is public, so this needs no token.
      POLL_CONFIG: |
        - source: git
          url: https://github.com/HAN-Craftsmanship-KL-JJG/casus.git
          reference: main
          interval: 3600
    volumes:
      # Full control over Docker on the server: whoever can change the
      # Compose files on the watched branch controls the server.
      - /var/run/docker.sock:/var/run/docker.sock
      - data:/data
    networks:
      # Shared with the web server of the ICDE stack, which passes the
      # webhook on. doco-cd publishes no port itself.
      - edge
    healthcheck:
      start_period: 15s
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  edge:
    name: edge

volumes:
  data:
