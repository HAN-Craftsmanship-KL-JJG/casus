# The fixed part of the server. doco-cd keeps it up to date, see docs/server.md.
name: infra

services:
  proxy:
    image: caddy:2.11.9-alpine
    restart: unless-stopped
    # The admin API of Caddy, which only listens inside the container.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
    cap_drop:
      - ALL
    cap_add:
      # For ports 80 and 443.
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
    networks:
      - proxy

  doco-cd:
    image: ghcr.io/kimdre/doco-cd:0.134.0
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
    environment:
      TZ: Europe/Amsterdam
      # Lets doco-cd replace its own container.
      SELF_UPDATE_ENABLED: "true"
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?Set WEBHOOK_SECRET in .env}
      # Checks GitHub each hour, in case a webhook is lost.
      # The target selects the file: .doco-cd.prd.yml or .doco-cd.dev.yml.
      POLL_CONFIG: |
        - source: git
          url: https://github.com/HAN-Craftsmanship-KL-JJG/casus.git
          reference: main
          target: prd
          interval: 3600
        - source: git
          url: https://github.com/HAN-Craftsmanship-KL-JJG/casus.git
          reference: develop
          target: dev
          interval: 3600
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - doco-cd-data:/data
      # The secrets, for when doco-cd deploys this file.
      - /srv/infra/.env:/srv/infra/.env:ro
    networks:
      - proxy
    healthcheck:
      start_period: 15s
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  # The ICDE stacks join this network.
  proxy:
    name: proxy

volumes:
  caddy-data:
  caddy-config:
  doco-cd-data:
