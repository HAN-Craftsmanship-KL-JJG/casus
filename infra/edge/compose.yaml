# The fixed part of the server: the proxy and doco-cd. This is its own Compose
# project. Start it by hand on the server with `docker compose up -d`, and
# again after a change to this directory. doco-cd does not deploy it.
name: edge

services:
  # The only container with open ports. Gets the certificates and passes
  # each domain name on to the right container.
  proxy:
    image: caddy:2.11.9-alpine
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      # Needed to listen on ports below 1024.
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
    networks:
      - edge

  # Deploys the ICDE stacks that .doco-cd.yml and .doco-cd.dev.yml in the
  # repository root name, and leaves all other containers alone.
  doco-cd:
    image: ghcr.io/kimdre/doco-cd:0.134.0
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
    environment:
      TZ: Europe/Amsterdam
      # The workflow .github/workflows/deploy.yml calls the webhook after a
      # push, so a change deploys within seconds. The value comes from the
      # file `.env` next to this file on the server.
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?Set WEBHOOK_SECRET in .env}
      # Safety net for a lost webhook call: ask GitHub once per hour.
      # The repository is public, so this needs no token.
      # `target: dev` makes doco-cd read .doco-cd.dev.yml.
      POLL_CONFIG: |
        - source: git
          url: https://github.com/HAN-Craftsmanship-KL-JJG/casus.git
          reference: main
          interval: 3600
        - source: git
          url: https://github.com/HAN-Craftsmanship-KL-JJG/casus.git
          reference: develop
          target: dev
          interval: 3600
    volumes:
      # Full control over Docker on the server: whoever can change the
      # Compose files on a watched branch controls the server.
      - /var/run/docker.sock:/var/run/docker.sock
      - doco-cd-data:/data
    networks:
      - edge
    healthcheck:
      start_period: 15s
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  # The ICDE stacks join this network, so the proxy can reach them.
  edge:
    name: edge

volumes:
  caddy-data:
  caddy-config:
  doco-cd-data:
