name: Deploy

# Tells doco-cd on the server that the stack changed. doco-cd then pulls the
# repository and runs the new version. See infra/README.md.
on:
  push:
    # build/uitrol-icde is here to test the webhook before the merge.
    # Remove it when the pull request merges.
    branches: [main, build/uitrol-icde]
    paths:
      - .doco-cd.yml
      - compose.yaml
      - apps/**
      - infra/**
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    # The secret lives in this environment, which only allowed branches may use.
    environment: production
    steps:
      - name: Send signed push event to doco-cd
        env:
          WEBHOOK_URL: https://deploy.icde.nl/v1/webhook
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          payload=$(jq -n \
            --arg ref "$GITHUB_REF" \
            --arg sha "$GITHUB_SHA" \
            --arg clone_url "https://github.com/${GITHUB_REPOSITORY}.git" \
            --arg name "${GITHUB_REPOSITORY##*/}" \
            --arg full_name "$GITHUB_REPOSITORY" \
            --arg actor "$GITHUB_ACTOR" \
            '{
              ref: $ref,
              before: $sha,
              after: $sha,
              repository: {name: $name, full_name: $full_name, clone_url: $clone_url},
              pusher: {name: $actor, email: "noreply@github.com"}
            }')
          signature=$(printf '%s' "$payload" \
            | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | sed 's/^.* //')
          curl --fail-with-body --silent --show-error --max-time 30 \
            -X POST "$WEBHOOK_URL" \
            -H "X-GitHub-Event: push" \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: sha256=$signature" \
            -d "$payload"
