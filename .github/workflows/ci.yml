name: Lint

# Fails on any lint or format violation in the C++ and TypeScript code.
on:
  pull_request:
    paths:
      - .clang-format
      - .clang-tidy
      - .github/workflows/lint.yml
      - api/**
      - documentserver/**
      - web/**
  push:
    branches: [main, develop]
    paths:
      - .clang-format
      - .clang-tidy
      - .github/workflows/lint.yml
      - api/**
      - documentserver/**
      - web/**

permissions:
  contents: read

jobs:
  clang-format:
    runs-on: ubuntu-latest
    # The base image of the Dockerfiles, so the same Clang version.
    container: debian:13-slim
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y --no-install-recommends clang-format
      - run: >-
          find api documentserver \( -name '*.cpp' -o -name '*.hpp' \)
          -exec clang-format --dry-run --Werror {} +

  clang-tidy:
    runs-on: ubuntu-latest
    container: debian:13-slim
    strategy:
      fail-fast: false
      matrix:
        app: [api, documentserver]
    env:
      VCPKG_ROOT: /opt/vcpkg
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
      # The packages of the Dockerfile, plus clang-tidy.
      - run: >-
          apt-get update && apt-get install -y --no-install-recommends
          autoconf automake bison ca-certificates clang clang-tidy cmake curl flex git libtool
          make ninja-build perl pkg-config python3 python3-venv tar unzip zip
      - name: Install vcpkg with the tag from the Dockerfile
        run: |
          tag=$(sed -n 's/^ARG VCPKG_TAG=//p' ${{ matrix.app }}/Dockerfile)
          git clone --depth 1 --branch "$tag" https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
      # vcpkg keeps each built library here, so it builds Drogon only once.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-${{ matrix.app }}-${{ hashFiles(format('{0}/vcpkg.json', matrix.app)) }}
          restore-keys: vcpkg-${{ matrix.app }}-
      - working-directory: ${{ matrix.app }}
        run: cmake --preset lint && cmake --build --preset lint

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Keep equal to the node image in web/Dockerfile.
          node-version: 24.22.3
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
