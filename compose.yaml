# ICDE stack, the part that is the same on a laptop and on the server.
# `docker compose up` also loads compose.override.yaml (laptop).
# The server loads infra/compose.server.yaml instead, see .doco-cd.yml.
name: icde

services:
  # Web server. Serves the frontend. Later it also passes /api on to the
  # application server.
  web:
    image: caddy:2.11.9-alpine
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      # Address Caddy listens on. A bare port means plain HTTP.
      SITE_ADDRESS: ${SITE_ADDRESS:-:8080}
    volumes:
      - ./apps/web/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./apps/web/public:/srv:ro
      # Certificates on the server. Empty on a laptop.
      - caddy-data:/data
    tmpfs:
      - /config

volumes:
  caddy-data:
