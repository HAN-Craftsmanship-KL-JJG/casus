# The ICDE stack. See infra/README.md.
name: icde

services:
  web:
    image: caddy:2.11.9-alpine
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./apps/web/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./apps/web/public:/srv:ro
    tmpfs:
      - /data
      - /config
