# ICDE on a laptop: builds the images here. Start with `docker compose up -d --build`.
# The server uses compose.server.yaml. Keep the two files the same in every other way.
name: icde

services:
  web:
    build: ./web
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /data
      - /config
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - api

  api:
    build: ./api
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    environment:
      DB_HOST: db
      DB_NAME: icde
      DB_USER: icde
      DB_PASSWORD: icde
    depends_on:
      - db

  db:
    image: postgres:17.12-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: icde
      POSTGRES_USER: icde
      POSTGRES_PASSWORD: icde
    volumes:
      - db-data:/var/lib/postgresql/data
      # Creates the tables in an empty database.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

volumes:
  db-data:
