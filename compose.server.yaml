# ICDE on the server. doco-cd starts it once per environment, see docs/server.md.
# ICDE_TAG is the branch: main or develop.

services:
  web:
    image: ghcr.io/han-craftsmanship-kl-jjg/icde-web:${ICDE_TAG:?Set ICDE_TAG to main or develop}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /data
      - /config
    depends_on:
      - api
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
    networks:
      default:
      proxy:
        aliases:
          # The proxy finds the web server by this name.
          - ${COMPOSE_PROJECT_NAME}-web

  api:
    image: ghcr.io/han-craftsmanship-kl-jjg/icde-api:${ICDE_TAG:?Set ICDE_TAG to main or develop}
    restart: unless-stopped
    # Checks that the port answers. The image has no HTTP client.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 30s
      timeout: 5s
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    environment:
      DB_HOST: db
      DB_NAME: icde
      DB_USER: icde
      DB_PASSWORD: icde
      DOCUMENTSERVER_URL: http://documentserver:8080
    depends_on:
      - db
      - documentserver
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m

  # Makes PDF and Word files for the application server.
  documentserver:
    image: ghcr.io/han-craftsmanship-kl-jjg/icde-documentserver:${ICDE_TAG:?Set ICDE_TAG to main or develop}
    restart: unless-stopped
    # Checks that the port answers.
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8080"]
      interval: 30s
      timeout: 5s
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512m

  db:
    image: postgres:17.12-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "--username", "icde", "--dbname", "icde"]
      interval: 30s
      timeout: 5s
    environment:
      POSTGRES_DB: icde
      POSTGRES_USER: icde
      # Move the password to a secret before the database holds real data.
      POSTGRES_PASSWORD: icde
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m

networks:
  proxy:
    external: true

volumes:
  db-data:
